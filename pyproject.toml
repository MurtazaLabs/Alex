# pyproject.toml
[project]
name = "forex-ai-agent"
version = "0.1.0"
description = "Forex Research & Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "structlog>=24.1.0",
    "hypothesis>=6.92.0",
    "click>=8.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "slowapi>=0.1.9",
    "neo4j>=5.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]
feeds = [
    "yfinance>=0.2.40",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]
dashboard = [
    "streamlit>=1.30.0",
    "streamlit-autorefresh>=1.0.1",
    "plotly>=5.18.0",
    "networkx>=3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
preview = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "B", "C4", "DT", "T20", "I001"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "D100"]
"migrations/*" = ["D100", "D101", "D102", "D103", "D104", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*", "*/conftest.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if TYPE_CHECKING :",
    "if typing.TYPE_CHECKING:",
]
